[project]
name = "scat-observation"
version = "0.1.0"
description = "SCAT observation and slit auto guiding"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.24,<3",
    "scipy>=1.10,<2",
    "astropy>=5.3,<8",
    "streamlit>=1.37,<2",
    "pywin32>=306; sys_platform == 'win32'",
]

[tool.uv]
package = false

[dependency-groups]
notebook = [
    "ipykernel>=7.3.0",
    "matplotlib>=3.11.2",
    "nbclient>=0.11.0",
    "nbformat>=5.11.1",
]
